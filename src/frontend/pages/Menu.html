<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Skyquest The Puzzle Journey</title>
    <link rel="stylesheet" href="/src/frontend/stylesheet/menu.css" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.3/dist/leaflet.css"
    />
    <script src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js"></script>
    <script type="module" src="/src/frontend/javascript/map.js" defer></script>
    <script type="module" src="/src/frontend/javascript/api.js"></script>
  </head>
  <body>
    <div id="game-history"></div>
    <div class="m">
      <header>
        <h2 id="m-title">Skyquest: The Puzzle Journey</h2>
      </header>
      <main>
        <div id="map"></div>
        <div class="m-b">
          <nav>
            <ul>
              <li>
                <a href="Rules&Guidance.html"
                  ><button
                    type="button"
                    id="r&g"
                    title="Click to check the rules and guidance"
                  >
                    ?
                  </button></a
                >
              </li>
            </ul>
          </nav>
          <h5 id="status">Status:</h5>
          <nav>
            <ul class="sta">
              <li id="n">🧭Explorer : <span id="name">" "</span></li>
              <li>🪙Money(€) : <span id="coin">" "</span></li>
              <li>🧩Pieces : <span id="puzzle">" "</span></li>
              <li>📍Location : <span id="location">" "</span></li>
            </ul>
          </nav>
          <h5 id="options">Options:</h5>
          <nav>
            <ul class="cho">
              <li>
                <a href="Clue.html"
                  ><button type="button" id="clue" title="Click to check clue">
                    Clue
                  </button></a
                >
              </li>
              <li>
                <a href="Quiz.html"
                  ><button
                    type="button"
                    id="quiz"
                    title="Click to answer quizzes"
                  >
                    Quiz
                  </button></a
                >
              </li>
              <li>
                <a href="Home.html"
                  ><button type="button" id="exit" title="Click to exit">
                    <b>EXIT</b>
                  </button></a
                >
              </li>
            </ul>
          </nav>
        </div>
      </main>
      <script>
        refreshPlayerUI();
      <script>
    </div>
  </body>
</html>
