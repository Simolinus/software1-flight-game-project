<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Skyquest The Puzzle Journey</title>
    <link rel="stylesheet" href="/src/frontend/stylesheet/clue-quiz.css" />
  </head>
  <body>
    <header>
      <div class="sky">
        <h2 id="m-title">Skyquest: The Puzzle Journey</h2>
      </div>
    </header>
    <img
      src="https://www.komar.de/media/catalog/product/cache/5/image/9df78eab33525d08d6e5fb8d27136e95/import/api-v1.1-file-public-files-pim-assets-97-ad-84-62-6284ad972eff292d45ce1a2e-images-6e-4c-f4-65-65f44c6e5f18b477d8eee055-iax10-0027-vintage-world-map-web.jpg"
      alt="Main Image"
      class="r-img"
    />
    <main class="q">
      <div class="left-section">
        <a href="Menu.html"><button type="button" id="back">⏎Back</button></a>
        <h3 id="quiz">Quiz:</h3>
        <p id="quizzes">🤔<span class="qui">quiz</span></p>
        <div class="ans">
          <input type="text" id="answer" placeholder="Enter your answer" />
          <button type="button" id="submit" title="Click to submit your answer">
            Submit
          </button>
        </div>
      </div>
      <div class="right-section">
        <h5 id="status">Status:</h5>
        <nav>
          <ul class="sta">
            <li id="n">🧭Explorer : <span id="name">name</span></li>
            <li>🪙Coins : <span id="coin">coin</span></li>
            <li>🧩Puzzle : <span id="puzzle">puzzle</span></li>
            <li>📍Location : <span id="location">location</span></li>
          </ul>
        </nav>
      </div>
    </main>
  </body>
</html>
