<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Skyquest The Puzzle Journey</title>
    <link rel="stylesheet" href="/src/frontend/stylesheet/home.css" />
    <script type="module" src="/src/frontend/javascript/api.js"></script>
    <script type="module" src="/src/frontend/javascript/game_story.js"></script>
  </head>
  <body>
    <div class="h">
      <img
        src="https://www.komar.de/media/catalog/product/cache/5/image/9df78eab33525d08d6e5fb8d27136e95/import/api-v1.1-file-public-files-pim-assets-97-ad-84-62-6284ad972eff292d45ce1a2e-images-6e-4c-f4-65-65f44c6e5f18b477d8eee055-iax10-0027-vintage-world-map-web.jpg"
        alt="Home Image"
        class="h-img"
      />
      <header>
        <div class="h-title">
          <h1 id="h-sq">Skyquest</h1>
          <h4 id="h-pj">The Puzzle Journey</h4>
        </div>
      </header>
      <main>
         <div id="story-area"></div>
        <p>
          <button type="button" id="n-game" title="Click to play new game">
            New Game
          </button>
        </p>
        <div class="entername">
          <h6 id="explorer">Explorer:</h6>
          <input type="text" id="name" placeholder="Enter your name" />
          <nav>
            <ul>
              <li>
                <button type="button" id="start" title="Click to start">
                  Start ✈
                </button>
              </li>
            </ul>
          </nav>
        </div>
      </main>
    </div>
    <script type="module">
      import { startNewGame } from "../javascript/api.js";

      const startBtn = document.getElementById("start");
      startBtn.onclick = async () => {
        const name = document.getElementById("name").value;
        if (!name) {
          alert("Please enter your name before starting the journey!");
          return;
        }
        const result = await startNewGame(name);
        console.log(result);
        console.log("start new game");
        window.location.href = "Menu.html";
      };
      </script>
  </body>
</html>
